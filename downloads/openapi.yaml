        status:
          type: string
          const: DELETED
        reason:
          type: string
          maxLength: 500
  responses:
    ParamInvalid:
      description: 公共loginAccount缺失、重复、非法编码/格式，或正文及参数不符合定义
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SystemError:
      description: 121内部异常
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SystemBusy:
      description: 121暂时不可用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
security:
  - AppId: []
    AppSecret: []
webhooks:
  purchaseDraftDeleted:
    post:
      summary: 121采购草稿删除通知；发送至配置的接收地址，使用独立反向密钥
      description: >-
        固定URL由121运维配置，不从请求获取；正式HTTPS；测试HTTP须对应目标allow-http:
        true，默认false。URL不得带userinfo、query或fragment。回调使用固定App-Id、App-Secret请求头；HTTP明文传输凭据和正文，仅用于测试。
      parameters:
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/AppSecret'
      security:
        - AppId: []
          AppSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeletionEvent'
      responses:
        '200':
          description: 事件已持久处理；重复eventId也返回2xx。非2xx会重试。
