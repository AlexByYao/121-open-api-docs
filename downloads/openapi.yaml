        storeId:
          type: string
          minLength: 1
          maxLength: 19
          pattern: '^[1-9][0-9]{0,18}$'
        provinceId:
          type: string
          minLength: 1
          maxLength: 19
          pattern: '^[1-9][0-9]{0,18}$'
        saleChannelId:
          type: string
          minLength: 1
          maxLength: 19
          pattern: '^[1-9][0-9]{0,18}$'
        paymentMethodId:
          type: string
          minLength: 1
          maxLength: 19
          pattern: '^[1-9][0-9]{0,18}$'
        fundPlanId:
          type: string
          minLength: 1
          maxLength: 19
          pattern: '^[1-9][0-9]{0,18}$'
        transportCost:
