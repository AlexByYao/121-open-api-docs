        - $ref: '#/components/parameters/XContentSha256'
        - $ref: '#/components/parameters/XSignature'
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum:
              - departments
              - suppliers
              - projects
              - stores
              - provinces
              - sale-channels
              - payment-methods
              - fund-plans
              - transport-costs
              - tax-rates
              - cash-cycles
              - approval-users
        - name: deptId
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 19
            pattern: '^[1-9][0-9]{0,18}$'
        - name: projectId
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 19
            pattern: '^[1-9][0-9]{0,18}$'
            description: 仅stores生效；其他类型忽略，但只要传入仍须正整数ID
        - name: parentId
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 19
            pattern: '^[1-9][0-9]{0,18}$'
            description: 按返回项parentId过滤；只建议departments使用，其他字典通常为空列表
        - name: keyword
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: roleCode
          in: query
          required: false
          schema:
            type: string
            description: 仅approval-users生效且必填；PRODUCT_MANAGER限定本部门，其他有效角色允许跨部门，其他字典类型忽略
            enum:
              - PRODUCT_MANAGER
              - DEPARTMENT_MANAGER
              - DEPARTMENT_LEADER
              - BUSINESS_REVIEWER
              - BUDGET_REVIEWER
              - CHIEF_ACCOUNTANT
              - GENERAL_MANAGER
        - name: pageNum
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      security:
        - HmacHeaders: []
      responses:
        '200':
          description: 成功
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - errorCode
                  - message
                  - requestId
                  - data
                properties:
                  code:
                    type: integer
                    const: 200
                  errorCode:
                    type: 'null'
                    description: 成功时固定为null
                  message:
                    type: string
                  requestId:
                    type: string
                    minLength: 1
                    maxLength: 128
                  data:
                    $ref: '#/components/schemas/DictionaryPage'
        '400':
