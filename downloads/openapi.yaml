components:
  securitySchemes:
    AppId:
      type: apiKey
      in: header
      name: App-Id
      description: 121交付的应用编号，与AppSecret同时使用
    AppSecret:
      type: apiKey
      in: header
      name: App-Secret
      description: 固定密钥原样传入，仅服务端保存；与AppId同时使用
  parameters:
    AppId:
      name: App-Id
      in: header
      required: true
      description: 本环境固定值；不得重复或包含空格、换行
      schema:
        type: string
        minLength: 1
        maxLength: 256
        pattern: '^[!-~]{1,256}$'
    AppSecret:
      name: App-Secret
      in: header
      required: true
      description: 本环境固定值；不得重复或包含空格、换行
      schema:
        type: string
        minLength: 1
        maxLength: 256
        pattern: '^[!-~]{1,256}$'
    LoginAccount:
      name: loginAccount
      in: header
      required: true
      description: >-
        当前已绑定的121账号，存在且启用；非ASCII或%先UTF-8百分号编码，如张三为%E5%BC%A0%E4%B8%89。严格解码一次，+不作空格，不接受重复头、非法UTF-8或换行。解码后原始输入最多128码点，清理首尾ASCII空格后1—30码点，无内部空白、控制和格式字符。此项是操作人声明，不是独立登录凭据。
      schema:
        type: string
        minLength: 1
        maxLength: 1536
        pattern: '^[ -~]{1,1536}$'
      example: zhangsan
  schemas:
    VerifyUserRequest:
      type: object
      additionalProperties: false
      maxProperties: 1
      properties:
        loginAccount:
          type:
            - string
            - 'null'
          maxLength: 128
          deprecated: true
          description: 可选旧版兼容字段，建议省略。非null时按原账号规则规范化后须与公共账号相同，否则403 OPERATOR_FORBIDDEN；不是查询其他用户的参数
    Department:
      type: object
      additionalProperties: true
      required:
        - id
        - code
        - name
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
        code:
          type: string
          maxLength: 64
          description: 无部门编码时返回空字符串
        name:
          type: string
          minLength: 1
          maxLength: 100
    User:
      type: object
      additionalProperties: true
      required:
        - userId
        - loginAccount
        - userName
        - phoneNumber
        - status
        - departments
      properties:
        userId:
          type: string
          minLength: 1
          maxLength: 64
        loginAccount:
          type: string
          minLength: 1
          maxLength: 30
        userName:
          type: string
          maxLength: 100
          description: 姓名或昵称未维护时为空字符串
        phoneNumber:
          type: string
          description: 121用户资料sys_user.phonenumber中维护的完整手机号；未维护时为空字符串，不影响账号校验
        status:
          type: string
          enum:
            - ACTIVE
        departments:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Department'
          description: 公共用户所属有效部门与应用授权部门的交集，至少1项。all-departments=true也不授予其他用户部门权限
    SuccessResponse:
      type: object
      additionalProperties: true
      required:
        - code
        - errorCode
        - message
        - requestId
        - data
      properties:
        code:
          type: integer
          const: 200
          description: 数字状态码；成功为200
        errorCode:
          type: 'null'
          description: 成功时固定为null
        message:
          type: string
        requestId:
          type: string
          minLength: 16
          maxLength: 128
          description: 121自动生成的本次请求追踪编号
        data:
          $ref: '#/components/schemas/User'
    ErrorResponse:
      type: object
      additionalProperties: true
      required:
        - code
        - errorCode
        - message
        - requestId
        - data
      properties:
        code:
          type: integer
          enum:
            - 400
            - 401
            - 403
            - 404
            - 405
            - 409
            - 413
            - 415
            - 422
            - 500
            - 503
          description: 数字错误码，与HTTP状态相同；具体原因见errorCode
        errorCode:
          type: string
          enum:
            - PARAM_INVALID
            - AUTH_INVALID
            - AUTH_FORBIDDEN
            - OPERATOR_FORBIDDEN
            - USER_NOT_FOUND
            - DRAFT_NOT_FOUND
            - NOT_FOUND
            - METHOD_NOT_ALLOWED
            - IDEMPOTENCY_CONFLICT
            - SOURCE_ALREADY_SYNCED
            - DRAFT_NOT_EDITABLE
            - SUPPLIER_IMMUTABLE
            - PAYLOAD_TOO_LARGE
            - UNSUPPORTED_MEDIA_TYPE
            - USER_DISABLED
            - REFERENCE_INVALID
            - MATERIAL_NOT_FOUND
            - MATERIAL_AMBIGUOUS
            - AMOUNT_MISMATCH
            - ORDER_CREATE_FAILED
            - DETAIL_CREATE_FAILED
            - SYSTEM_ERROR
            - SYSTEM_BUSY
          description: >-
            PARAM_INVALID：请求参数错误；AUTH_INVALID：App-Id或App-Secret缺失、重复、错误，应用停用或入口关闭；AUTH_FORBIDDEN：缺少接口scope；OPERATOR_FORBIDDEN：用户/部门越权、禁止代发或修改所属部门；USER_NOT_FOUND：用户不存在或已删；DRAFT_NOT_FOUND：同步采购单不存在或不可见；NOT_FOUND：字典类型不存在；METHOD_NOT_ALLOWED：HTTP方法不支持；IDEMPOTENCY_CONFLICT：幂等键或批次与原请求冲突；SOURCE_ALREADY_SYNCED：来源已有有效关联；DRAFT_NOT_EDITABLE：状态不允许删除/修改；SUPPLIER_IMMUTABLE：来源单供应商不可改；PAYLOAD_TOO_LARGE：请求体超过大小上限；UNSUPPORTED_MEDIA_TYPE：媒体类型或编码不支持；USER_DISABLED：用户已停用；REFERENCE_INVALID：供应商或其他引用数据无效；MATERIAL_NOT_FOUND：一个或多个物料不存在；MATERIAL_AMBIGUOUS：物料编码匹配不唯一；AMOUNT_MISMATCH：采购金额与数量乘单价不一致；ORDER_CREATE_FAILED：采购主单未成功保存；DETAIL_CREATE_FAILED：采购明细添加失败；SYSTEM_ERROR：内部处理失败；SYSTEM_BUSY：暂不可用
        message:
          type: string
        requestId:
          type: string
          minLength: 16
          maxLength: 128
          description: 121自动生成的本次请求追踪编号
        data:
          description: >-
            无详情时为null；已知校验错误返回ErrorDetail；SOURCE_ALREADY_SYNCED返回经部门授权校验的原Draft（含原syncBatchId），不得当作本次创建成功。客户端兼容可选字段。
          anyOf:
            - type: 'null'
            - $ref: '#/components/schemas/ErrorDetail'
            - $ref: '#/components/schemas/Draft'
    ErrorDetail:
      type: object
      additionalProperties: true
      properties:
        field:
          type: string
          description: '字段路径；明细使用details[0].purchasePrice，数组下标从0开始'
        sourceDetailId:
          type: string
          minLength: 1
          maxLength: 64
        reason:
          type: string
          enum:
            - REQUIRED
            - INVALID_VALUE
            - TYPE_INVALID
            - UNKNOWN_FIELD
            - UNAVAILABLE
            - NOT_FOUND
            - DISABLED
            - DEPARTMENT_MISMATCH
            - ROLE_MISSING
        referenceType:
          type: string
        referenceId:
          type:
            - string
            - 'null'
        deptId:
          type: string
          minLength: 1
          maxLength: 19
          pattern: '^[1-9][0-9]{0,18}$'
        roleCode:
          type: string
        materialCode:
          type: string
          minLength: 1
          maxLength: 64
        matchCount:
          type: integer
        missingMaterialCodes:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
        provided:
          type: number
        calculated:
          type: number
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        stage:
          type: string
          enum:
            - ORDER_CREATE
            - DETAIL_CREATE
        rolledBack:
          type: boolean
          description: true表示本次主单和全部明细、同步关联一起回滚
    DraftDetail:
      type: object
      additionalProperties: false
      required:
        - sourceDetailId
        - materialCode
        - quantity
        - purchasePrice
        - salesQuantity
        - salesPrice
        - inventoryQuantity
      properties:
        sourceDetailId:
          type: string
          minLength: 1
          maxLength: 64
        materialCode:
          type: string
          minLength: 1
          maxLength: 64
        materialName:
          type: string
          maxLength: 100
        productCode:
          type: string
          maxLength: 64
        brandName:
          type: string
          maxLength: 100
        quantity:
          type: integer
          minimum: 1
          maximum: 999999999
        purchasePrice:
          type: number
          minimum: 0
          maximum: 9999999999999.99
          multipleOf: 0.01
        purchaseAmount:
          type: number
          minimum: 0
          maximum: 9999999999999.99
          multipleOf: 0.01
        salesQuantity:
          type: integer
          minimum: 0
          maximum: 999999999
        salesPrice:
          type: number
          minimum: 0
          maximum: 9999999999999.99
          multipleOf: 0.01
        inventoryQuantity:
          type: integer
          minimum: 0
          maximum: 999999999
        detailTaxRate:
          type:
            - number
            - 'null'
          minimum: -9999999999999.99
          maximum: 9999999999999.99
          multipleOf: 0.01
          description: '沿用原明细DECIMAL(15,2)有符号范围，最多两位有效小数；0.09表示9%；省略或null继承主单税率，不套用主单枚举'
        remark:
          type: string
          maxLength: 500
    CreateDraftRequest:
      type: object
      additionalProperties: false
      required:
        - sourceSystem
        - sourceOrderId
        - syncBatchId
        - deptId
        - supplierId
        - authorized
        - storeId
        - provinceId
        - saleChannelId
        - fundPlanId
        - transportCost
        - taxRate
        - cashCycle
        - budgetMonth
        - purchaseDate
        - details
      properties:
