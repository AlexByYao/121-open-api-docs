openapi: 3.1.0
info:
  title: 121 智能化采购同步开放接口
  version: 1.1.8
  description: >-
    服务器对服务器；应用内HMAC-SHA256鉴权。代码已实现、默认关闭，部署后联调。测试允许HTTP、正式HTTPS；每环境初次配置一套系统凭据，无需mTLS或轮换流程。客户端可显式授权全部有效部门或使用部门白名单；默认空白名单不授权。完整签名算法与实际约束见配套Markdown。
servers:
  - url: 'http://testfcst.chinaptac.com/open-api/v1'
    description: 测试环境，允许HTTP联调；开放时间及测试凭据由121提供方交付
  - url: 'https://fcst.chinaptac.com/open-api/v1'
    description: 正式环境，使用HTTPS；开放时间及正式凭据由121提供方交付
tags:
  - name: Users
    description: 121用户查询
paths:
  /users/verify:
    post:
      tags:
        - Users
      operationId: verify121User
      summary: 查询121用户信息
      description: |
        按121登录账号精确查询用户。调用方为智能化后台服务器，浏览器不得直接调用。
        请求体原始字节和以下请求头参与HMAC-SHA256签名：
        X-Client-Id、X-Key-Id、X-Timestamp、X-Nonce、X-Request-Id、Idempotency-Key、X-Content-SHA256。
        本接口无查询参数和Idempotency-Key，但签名原文保留对应空行。
      security:
        - HmacHeaders: []
      parameters:
        - $ref: '#/components/parameters/XClientId'
        - $ref: '#/components/parameters/XKeyId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XNonce'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XContentSha256'
        - $ref: '#/components/parameters/XSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyUserRequest'
            examples:
              valid:
                value:
                  loginAccount: zhangsan
      responses:
        '200':
          description: 查询成功
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: 用户查询结果不得被共享缓存保存
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              examples:
                success:
                  value:
                    code: 200
                    errorCode: null
                    message: success
                    requestId: 7f7c8f45-0c8c-4b56-9b77-4c4bd7de9a41
                    data:
                      userId: '10086'
                      loginAccount: zhangsan
                      userName: 张三
                      phoneNumber: '13800000000'
                      status: ACTIVE
                      departments:
                        - id: '80001'
                          code: EXAMPLE_DEPT_80001
                          name: 示例业务部
        '400':
          $ref: '#/components/responses/ParamInvalid'
        '401':
          description: 客户端身份、签名、时间戳或防重放校验失败
          headers:
            WWW-Authenticate:
              schema:
                type: string
                const: HMAC realm="121-open-api"
              description: 121自定义HMAC认证方案标识
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidSignature:
                  value:
                    code: 401
                    errorCode: AUTH_SIGNATURE_INVALID
                    message: 请求签名无效
                    requestId: 7f7c8f45-0c8c-4b56-9b77-4c4bd7de9a41
                    data: null
        '403':
          description: 客户端或用户无权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 用户不存在或已删除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  value:
                    code: 404
                    errorCode: USER_NOT_FOUND
                    message: 121登录账号不存在
                    requestId: 7f7c8f45-0c8c-4b56-9b77-4c4bd7de9a41
                    data: null
        '405':
          description: 请求方法不支持，code为405，errorCode为METHOD_NOT_ALLOWED
          headers:
            Allow:
              schema:
                type: string
              description: 支持的HTTP方法（POST）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: 请求体超过8KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: 不支持的媒体类型或请求体压缩
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 用户已停用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 超过调用频率
          headers:
            Retry-After:
              schema:
                type: integer
              description: 建议等待的秒数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/SystemError'
        '503':
          $ref: '#/components/responses/SystemBusy'
  '/dictionaries/{type}':
    get:
      operationId: listDictionary
      summary: 查询字典；除departments外deptId必填
      parameters:
        - $ref: '#/components/parameters/XClientId'
        - $ref: '#/components/parameters/XKeyId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XNonce'
