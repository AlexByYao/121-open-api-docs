              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: 参见Markdown错误码表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 参见Markdown错误码表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 参见Markdown错误码表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 参见Markdown错误码表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 参见Markdown错误码表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequest'
components:
  securitySchemes:
    HmacHeaders:
      type: apiKey
      in: header
      name: X-Signature
      description: |
        HMAC-SHA256签名。实际校验还需要X-Client-Id、X-Key-Id、X-Timestamp、X-Nonce、X-Request-Id和X-Content-SHA256。
        签名密钥不写入OpenAPI文件。
  parameters:
    XClientId:
      name: X-Client-Id
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^[A-Za-z0-9._:-]+$'
    XKeyId:
      name: X-Key-Id
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^[A-Za-z0-9._:-]+$'
    XTimestamp:
      name: X-Timestamp
      in: header
      required: true
      schema:
        type: string
        pattern: '^[0-9]{10}$'
    XNonce:
      name: X-Nonce
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
    XRequestId:
      name: X-Request-Id
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
    XContentSha256:
      name: X-Content-SHA256
      in: header
      required: true
      schema:
        type: string
        minLength: 64
        maxLength: 64
        pattern: '^[0-9a-f]{64}$'
    XSignature:
      name: X-Signature
      in: header
      required: true
      schema:
        type: string
        minLength: 44
        maxLength: 44
        pattern: '^[A-Za-z0-9+/]{43}=$'
  schemas:
    VerifyUserRequest:
      type: object
      additionalProperties: false
      required:
        - loginAccount
      maxProperties: 1
      properties:
        loginAccount:
          type: string
          minLength: 1
          maxLength: 128
          description: 原始输入最长128个Unicode码点；验签后清理首尾U+0020空格，清理后须为1—30码点且无任何空白或控制字符，按121现有登录语义精确匹配
    Department:
      type: object
      additionalProperties: true
      required:
        - id
        - code
        - name
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
        code:
          type: string
          maxLength: 64
          description: 无部门编码时返回空字符串
        name:
          type: string
          minLength: 1
          maxLength: 100
    User:
      type: object
      additionalProperties: true
      required:
        - userId
        - loginAccount
        - userName
        - phoneNumber
        - status
        - departments
      properties:
        userId:
          type: string
          minLength: 1
          maxLength: 64
        loginAccount:
          type: string
          minLength: 1
          maxLength: 30
        userName:
          type: string
          maxLength: 100
          description: 姓名或昵称未维护时为空字符串
        phoneNumber:
          type: string
          description: 121用户资料sys_user.phonenumber中维护的完整手机号；未维护时为空字符串，不影响账号校验
        status:
          type: string
          enum:
            - ACTIVE
        departments:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Department'
          description: 当前客户端授权范围内的可操作部门
    SuccessResponse:
      type: object
      additionalProperties: true
      required:
        - code
        - errorCode
        - message
        - requestId
        - data
      properties:
        code:
          type: integer
          const: 200
          description: 数字状态码；成功为200
        errorCode:
          type: 'null'
          description: 成功时固定为null
        message:
          type: string
        requestId:
          type: string
          minLength: 16
          maxLength: 128
        data:
          $ref: '#/components/schemas/User'
    ErrorResponse:
      type: object
      additionalProperties: true
      required:
        - code
        - errorCode
        - message
        - requestId
        - data
      properties:
        code:
          type: integer
          enum:
            - 400
            - 401
            - 403
            - 404
            - 405
            - 409
            - 413
            - 415
            - 422
            - 429
            - 500
            - 503
          description: 数字错误码，与HTTP状态相同；具体原因见errorCode
        errorCode:
          type: string
          enum:
            - PARAM_INVALID
            - AUTH_CLIENT_NOT_FOUND
            - AUTH_SIGNATURE_INVALID
            - AUTH_TIMESTAMP_EXPIRED
            - AUTH_REPLAY_REQUEST
            - AUTH_FORBIDDEN
            - OPERATOR_FORBIDDEN
            - USER_NOT_FOUND
            - DRAFT_NOT_FOUND
            - NOT_FOUND
            - METHOD_NOT_ALLOWED
            - IDEMPOTENCY_CONFLICT
            - SOURCE_ALREADY_SYNCED
            - DRAFT_NOT_EDITABLE
            - SUPPLIER_IMMUTABLE
            - PAYLOAD_TOO_LARGE
            - UNSUPPORTED_MEDIA_TYPE
            - USER_DISABLED
            - REFERENCE_INVALID
            - MATERIAL_NOT_FOUND
            - MATERIAL_AMBIGUOUS
            - AMOUNT_MISMATCH
            - RATE_LIMITED
            - SYSTEM_ERROR
            - SYSTEM_BUSY
          description: >-
            PARAM_INVALID：请求参数错误；AUTH_CLIENT_NOT_FOUND：客户端或密钥不可用；AUTH_SIGNATURE_INVALID：签名或鉴权头无效；AUTH_TIMESTAMP_EXPIRED：请求时间过期；AUTH_REPLAY_REQUEST：请求重放；AUTH_FORBIDDEN：缺少接口scope；OPERATOR_FORBIDDEN：用户/部门越权、禁止代发或跨部门修改；USER_NOT_FOUND：用户不存在或已删；DRAFT_NOT_FOUND：同步采购单不存在或不可见；NOT_FOUND：字典类型不存在；METHOD_NOT_ALLOWED：HTTP方法不支持；IDEMPOTENCY_CONFLICT：幂等键或批次与原请求冲突；SOURCE_ALREADY_SYNCED：来源已有有效关联；DRAFT_NOT_EDITABLE：状态不允许删除/修改；SUPPLIER_IMMUTABLE：来源单供应商不可改；PAYLOAD_TOO_LARGE：请求体超过大小上限；UNSUPPORTED_MEDIA_TYPE：媒体类型或编码不支持；USER_DISABLED：用户已停用；REFERENCE_INVALID：供应商或其他引用数据无效；MATERIAL_NOT_FOUND：一个或多个物料不存在；MATERIAL_AMBIGUOUS：物料编码匹配不唯一；AMOUNT_MISMATCH：采购金额与数量乘单价不一致；RATE_LIMITED：超过客户端调用配额；SYSTEM_ERROR：内部处理失败；SYSTEM_BUSY：暂不可用
        message:
          type: string
        requestId:
          type: string
          minLength: 16
          maxLength: 128
        data:
          description: >-
            无详情时为null；已知校验错误返回ErrorDetail；SOURCE_ALREADY_SYNCED返回经部门授权校验的原Draft（含原syncBatchId），不得当作本次创建成功。客户端兼容可选字段。
          anyOf:
            - type: 'null'
            - $ref: '#/components/schemas/ErrorDetail'
            - $ref: '#/components/schemas/Draft'
    ErrorDetail:
      type: object
      additionalProperties: true
      properties:
        field:
          type: string
          description: '字段路径；明细使用details[0].purchasePrice，数组下标从0开始'
        sourceDetailId:
          type: string
          minLength: 1
          maxLength: 64
        reason:
          type: string
          enum:
            - REQUIRED
            - INVALID_VALUE
            - TYPE_INVALID
            - UNKNOWN_FIELD
            - UNAVAILABLE
            - NOT_FOUND
            - DISABLED
            - DEPARTMENT_MISMATCH
            - ROLE_MISSING
        referenceType:
          type: string
        referenceId:
          type:
            - string
            - 'null'
        departmentId:
          type: string
          minLength: 1
          maxLength: 19
          pattern: '^[1-9][0-9]{0,18}$'
        roleCode:
          type: string
        materialCode:
          type: string
          minLength: 1
          maxLength: 64
        matchCount:
          type: integer
        missingMaterialCodes:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
        provided:
          type: number
        calculated:
          type: number
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
    DraftDetail:
      type: object
      additionalProperties: false
      required:
        - sourceDetailId
        - materialCode
        - quantity
        - purchasePrice
        - salesQuantity
        - salesPrice
        - inventoryQuantity
      properties:
        sourceDetailId:
          type: string
          minLength: 1
          maxLength: 64
        materialCode:
          type: string
          minLength: 1
          maxLength: 64
        materialName:
          type: string
          maxLength: 100
        productCode:
          type: string
          maxLength: 64
        brandName:
          type: string
          maxLength: 100
        quantity:
          type: integer
          minimum: 1
          maximum: 999999999
        purchasePrice:
          type: number
          minimum: 0
          maximum: 9999999999999.99
          multipleOf: 0.01
        purchaseAmount:
          type: number
          minimum: 0
          maximum: 9999999999999.99
          multipleOf: 0.01
        salesQuantity:
          type: integer
          minimum: 0
          maximum: 999999999
        salesPrice:
          type: number
          minimum: 0
          maximum: 9999999999999.99
          multipleOf: 0.01
        inventoryQuantity:
          type: integer
          minimum: 0
          maximum: 999999999
        detailTaxRate:
          type: number
          enum:
            - 0
            - 0.06
            - 0.13
        remark:
          type: string
          maxLength: 500
    CreateDraftRequest:
      type: object
      additionalProperties: false
      required:
        - sourceSystem
        - sourceOrderId
        - syncBatchId
        - operatorLoginAccount
        - initiatorLoginAccount
        - departmentId
        - supplierId
        - authorized
        - storeId
        - provinceId
        - saleChannelId
        - fundPlanId
        - transportCost
        - taxRate
        - cashCycle
        - budgetMonth
        - purchaseDate
        - details
      properties:
        sourceSystem:
          type: string
          const: INTELLIGENT_OFFICE
        sourceOrderId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9_-]{1,64}$'
        syncBatchId:
          type: string
          format: uuid
        operatorLoginAccount:
          type: string
          minLength: 1
          maxLength: 30
        initiatorLoginAccount:
          type: string
          minLength: 1
          maxLength: 30
        departmentId:
          type: string
          minLength: 1
          maxLength: 19
          pattern: '^[1-9][0-9]{0,18}$'
        supplierId:
          type: string
          minLength: 1
          maxLength: 19
          pattern: '^[1-9][0-9]{0,18}$'
        supplierName:
          type: string
          maxLength: 100
          description: 不用于匹配或更新主数据；供应商ID不存在时用于错误提示，未传名称则提示ID
        authorized:
          type: boolean
        projectId:
          type: string
          minLength: 1
          maxLength: 19
          pattern: '^[1-9][0-9]{0,18}$'
        storeId:
          type: string
          minLength: 1
          maxLength: 19
          pattern: '^[1-9][0-9]{0,18}$'
        provinceId:
          type: string
          minLength: 1
          maxLength: 19
          pattern: '^[1-9][0-9]{0,18}$'
        saleChannelId:
          type: string
          minLength: 1
          maxLength: 19
          pattern: '^[1-9][0-9]{0,18}$'
        paymentMethodId:
          type: string
          minLength: 1
          maxLength: 19
          pattern: '^[1-9][0-9]{0,18}$'
        fundPlanId:
          type: string
          minLength: 1
          maxLength: 19
          pattern: '^[1-9][0-9]{0,18}$'
        transportCost:
          type: number
          minimum: 0
          maximum: 9999999999999.99
          multipleOf: 0.01
        taxRate:
          type: number
          enum:
            - 0
            - 0.06
            - 0.13
        cashCycle:
          type: integer
          minimum: 1
          maximum: 36500
          description: 天
        budgetMonth:
          type: string
          pattern: '^20[0-9]{2}-(0[1-9]|1[0-2])$'
        purchaseDate:
          type: string
          format: date
        contractNo:
          type: string
          maxLength: 64
        externalPurchaseOrderNo:
          type: string
          maxLength: 64
        remark:
          type: string
          maxLength: 500
        details:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/DraftDetail'
        productManagerUserId:
          type: string
          minLength: 1
          maxLength: 19
          pattern: '^[1-9][0-9]{0,18}$'
          description: 须为本部门具有有效产品经理角色的启用用户
        departmentManagerUserId:
          type: string
          minLength: 1
          maxLength: 19
          pattern: '^[1-9][0-9]{0,18}$'
          description: 具有对应有效角色的启用用户，可跨部门选择
        departmentLeaderUserId:
          type: string
          minLength: 1
          maxLength: 19
          pattern: '^[1-9][0-9]{0,18}$'
          description: 具有对应有效角色的启用用户，可跨部门选择
        businessReviewerUserId:
          type: string
          minLength: 1
          maxLength: 19
          pattern: '^[1-9][0-9]{0,18}$'
          description: 具有对应有效角色的启用用户，可跨部门选择
        budgetReviewerUserId:
          type: string
          minLength: 1
          maxLength: 19
          pattern: '^[1-9][0-9]{0,18}$'
          description: 具有对应有效角色的启用用户，可跨部门选择
        chiefAccountantUserId:
          type: string
          minLength: 1
          maxLength: 19
          pattern: '^[1-9][0-9]{0,18}$'
          description: 具有对应有效角色的启用用户，可跨部门选择
        generalManagerUserId:
          type: string
          minLength: 1
          maxLength: 19
          pattern: '^[1-9][0-9]{0,18}$'
          description: 具有对应有效角色的启用用户，可跨部门选择
    Draft:
      type: object
      required:
        - draftId
        - purchaseOrderNo
        - sourceSystem
        - sourceOrderId
        - syncBatchId
        - status
        - details
      properties:
        draftId:
          type: string
          minLength: 1
          maxLength: 19
          pattern: '^[1-9][0-9]{0,18}$'
        purchaseOrderNo:
          type: string
          minLength: 1
          maxLength: 64
          description: 需求中的121采购单序号，即purchase_apply.apply_id（Java applyId），与draftId相同，不另建编号
        sourceSystem:
          type: string
          minLength: 1
          maxLength: 64
        sourceOrderId:
          type: string
          minLength: 1
          maxLength: 64
        syncBatchId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - DRAFT
            - LOCKED
            - RETURN_PENDING
            - RETURNED
            - RETURN_REJECTED
            - DELETED
        details:
          type: array
          items:
            type: object
            required:
              - sourceDetailId
              - detailId
            properties:
              sourceDetailId:
                type: string
                minLength: 1
                maxLength: 64
              detailId:
                type: string
                minLength: 1
                maxLength: 19
                pattern: '^[1-9][0-9]{0,18}$'
    DictionaryItem:
      type: object
      required:
        - id
        - code
        - name
        - status
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
        code:
          type: string
        name:
          type: string
        status:
          type: string
          const: ACTIVE
        parentId:
          type: string
        relation:
          type: object
          properties:
            departmentId:
              type: string
              minLength: 1
              maxLength: 19
              pattern: '^[1-9][0-9]{0,18}$'
            projectId:
              type: string
        requiresProject:
          type: boolean
        value:
          type:
            - number
            - string
        unit:
          type: string
          enum:
            - DAY
            - CNY
            - RATIO
        loginAccount:
          type: string
          minLength: 1
          maxLength: 30
        departmentIds:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 19
            pattern: '^[1-9][0-9]{0,18}$'
          description: 用户成员部门与客户端本次部门范围的交集；显式全部模式覆盖全部有效部门；跨部门审批人可为空数组，不代表不可选
    DictionaryPage:
      type: object
      required:
        - items
        - total
        - pageNum
        - pageSize
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DictionaryItem'
        total:
          type: integer
        pageNum:
          type: integer
        pageSize:
          type: integer
    CancelRequest:
      type: object
      additionalProperties: false
      required:
        - operatorLoginAccount
      properties:
        operatorLoginAccount:
          type: string
          minLength: 1
          maxLength: 30
        reason:
          type: string
          maxLength: 500
    DeletionEvent:
      type: object
      required:
        - eventId
        - eventType
        - eventTime
        - sourceSystem
        - sourceOrderId
        - syncBatchId
        - draftId
        - purchaseOrderNo
        - status
        - reason
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
          const: PURCHASE_DRAFT_DELETED
        eventTime:
          type: string
          format: date-time
        sourceSystem:
          type: string
          minLength: 1
          maxLength: 64
        sourceOrderId:
          type: string
          minLength: 1
          maxLength: 64
        syncBatchId:
          type: string
          format: uuid
        draftId:
          type: string
          minLength: 1
          maxLength: 19
          pattern: '^[1-9][0-9]{0,18}$'
        purchaseOrderNo:
          type: string
          minLength: 1
          maxLength: 64
          description: 121采购单序号，即applyId，与draftId相同
        status:
          type: string
          const: DELETED
        reason:
          type: string
          maxLength: 500
  responses:
    ParamInvalid:
      description: 参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SystemError:
      description: 121内部异常
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SystemBusy:
      description: 121暂时不可用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
security:
  - HmacHeaders: []
webhooks:
  purchaseDraftDeleted:
    post:
      summary: 智能化提供的删除事件接收接口；由121主动调用，独立反向密钥
      description: >-
        固定URL由121运维配置，不从请求获取；正式HTTPS；测试HTTP须对应目标allow-http:
        true，默认false。URL不得带userinfo、query或fragment。签名算法不变；HTTP不加密正文，仅用于测试数据。
      parameters:
        - $ref: '#/components/parameters/XClientId'
        - $ref: '#/components/parameters/XKeyId'
        - $ref: '#/components/parameters/XTimestamp'
        - $ref: '#/components/parameters/XNonce'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XContentSha256'
        - $ref: '#/components/parameters/XSignature'
      security:
        - HmacHeaders: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeletionEvent'
      responses:
        '200':
          description: 事件已持久处理；重复eventId也返回2xx。非2xx会重试。
