        eventTime:
          type: string
          format: date-time
        sourceSystem:
          type: string
          minLength: 1
          maxLength: 64
        sourceOrderId:
          type: string
          minLength: 1
          maxLength: 64
        syncBatchId:
          type: string
          format: uuid
        draftId:
          type: string
          minLength: 1
          maxLength: 19
          pattern: '^[1-9][0-9]{0,18}$'
        purchaseOrderNo:
          type: string
          minLength: 1
          maxLength: 64
