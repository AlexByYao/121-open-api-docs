openapi: 3.1.0
info:
  title: 121 开放接口
  version: 2.4.0
  description: >-
    服务器对服务器；每个121入口携带App-Id、App-Secret和loginAccount，校验有效用户并限制在用户有效成员部门与应用授权交集。无需员工登录或Token。测试允许HTTP、正式HTTPS；本版本需部署新Jar及app-id/app-secret配置。业务幂等和部门权限保留。
servers:
  - url: 'http://testfcst.chinaptac.com/open-api/v1'
    description: 测试环境，允许HTTP联调；开放时间及测试凭据由121提供方交付
  - url: 'https://fcst.chinaptac.com/open-api/v1'
    description: 正式环境，使用HTTPS；开放时间及正式凭据由121提供方交付
tags:
  - name: Users
    description: 121用户查询
paths:
  /users/verify:
    post:
      tags:
        - Users
      operationId: verify121User
      summary: 查询121用户信息
      description: '返回公共loginAccount对应用户。POST正文可空或{}，不接受query或Idempotency-Key；兼容正文loginAccount非null时须与公共账号规范化后相同，否则403。'
      security:
        - AppId: []
          AppSecret: []
      parameters:
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/AppSecret'
        - $ref: '#/components/parameters/LoginAccount'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyUserRequest'
            examples:
              empty:
                summary: 推荐，账号在公共Header
                value: {}
      responses:
        '200':
          description: 查询成功
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: 用户查询结果不得被共享缓存保存
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              examples:
                success:
                  value:
                    code: 200
                    errorCode: null
                    message: success
                    requestId: 7f7c8f45-0c8c-4b56-9b77-4c4bd7de9a41
                    data:
                      userId: '10086'
                      loginAccount: zhangsan
                      userName: 张三
                      phoneNumber: '13800000000'
                      status: ACTIVE
                      departments:
                        - id: '80001'
                          code: EXAMPLE_DEPT_80001
                          name: 示例业务部
        '400':
          $ref: '#/components/responses/ParamInvalid'
        '401':
          description: App-Id/App-Secret缺失、重复、错误，应用停用或入口关闭
          headers:
            WWW-Authenticate:
              schema:
                type: string
                const: AppKey realm="121-open-api"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 401
                errorCode: AUTH_INVALID
                message: App-Id或App-Secret错误、缺失，或应用已停用
                requestId: 7f7c8f45-0c8c-4b56-9b77-4c4bd7de9a41
                data: null
        '403':
          description: 应用缺接口scope，用户无可用授权部门，或正文兼容账号与公共账号不一致
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 公共loginAccount对应账号不存在或已删除，errorCode=USER_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  value:
                    code: 404
                    errorCode: USER_NOT_FOUND
                    message: 121登录账号不存在
                    requestId: 7f7c8f45-0c8c-4b56-9b77-4c4bd7de9a41
                    data: null
        '405':
          description: 请求方法不支持，code为405，errorCode为METHOD_NOT_ALLOWED
          headers:
            Allow:
              schema:
                type: string
              description: 支持的HTTP方法（POST）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: 请求体超过8KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: 不支持的媒体类型或请求体压缩
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 公共loginAccount对应账号已停用，errorCode=USER_DISABLED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/SystemError'
        '503':
          $ref: '#/components/responses/SystemBusy'
  '/dictionaries/{type}':
    get:
      operationId: listDictionary
      summary: 查询字典；除departments外deptId必填
      parameters:
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/AppSecret'
        - $ref: '#/components/parameters/LoginAccount'
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum:
              - departments
              - suppliers
              - projects
              - stores
              - provinces
              - sale-channels
              - payment-methods
              - fund-plans
              - transport-costs
              - tax-rates
              - cash-cycles
              - approval-users
        - name: deptId
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 19
            pattern: '^[1-9][0-9]{0,18}$'
        - name: projectId
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 19
            pattern: '^[1-9][0-9]{0,18}$'
            description: 仅stores生效；其他类型忽略，但只要传入仍须正整数ID
        - name: parentId
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 19
            pattern: '^[1-9][0-9]{0,18}$'
            description: 按返回项parentId过滤；只建议departments使用，其他字典通常为空列表
        - name: keyword
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: roleCode
          in: query
          required: false
          schema:
            type: string
            description: 仅approval-users生效且必填；PRODUCT_MANAGER限定本部门，其他有效角色允许跨部门，其他字典类型忽略
            enum:
              - PRODUCT_MANAGER
              - DEPARTMENT_MANAGER
              - DEPARTMENT_LEADER
              - BUSINESS_REVIEWER
              - BUDGET_REVIEWER
              - CHIEF_ACCOUNTANT
              - GENERAL_MANAGER
        - name: pageNum
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      security:
        - AppId: []
          AppSecret: []
      responses:
        '200':
          description: 成功
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - errorCode
                  - message
                  - requestId
                  - data
                properties:
                  code:
                    type: integer
                    const: 200
                  errorCode:
                    type: 'null'
                    description: 成功时固定为null
                  message:
                    type: string
                  requestId:
                    type: string
                    minLength: 1
                    maxLength: 128
                  data:
                    $ref: '#/components/schemas/DictionaryPage'
        '400':
          description: 参见Markdown错误码表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
