openapi: 3.1.0
info:
  title: 121 User Verification API
  version: 2.6.0
  description: >-
    查询请求头loginAccount对应的121用户信息及可用部门。请求须携带有效的App-Id、App-Secret和loginAccount；返回部门为账号所属有效部门与应用授权部门的交集。
servers:
  - url: 'http://testfcst.chinaptac.com/open-api/v1'
    description: 测试环境，允许HTTP联调；开放时间及测试凭据由121提供方交付
  - url: 'https://fcst.chinaptac.com/open-api/v1'
    description: 正式环境，使用HTTPS；开放时间及正式凭据由121提供方交付
tags:
  - name: Users
    description: 121用户查询
paths:
  /users/verify:
    post:
      tags:
        - Users
      operationId: verify121User
      summary: 查询121用户信息
      description: '查询请求头loginAccount对应的用户。POST正文可为空或{}，不接受查询参数或Idempotency-Key；正文loginAccount提供非null值时须与请求头规范化后相同，否则返回403。'
      security:
        - AppId: []
          AppSecret: []
      parameters:
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/AppSecret'
        - $ref: '#/components/parameters/LoginAccount'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyUserRequest'
            examples:
              empty:
                summary: 推荐，账号在公共Header
                value: {}
      responses:
        '200':
          description: 查询成功
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: 用户查询结果不得被共享缓存保存
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              examples:
                success:
                  value:
                    code: 200
                    errorCode: null
                    message: success
                    requestId: 7f7c8f45-0c8c-4b56-9b77-4c4bd7de9a41
                    data:
                      userId: '10086'
                      loginAccount: zhangsan
                      userName: 张三
                      phoneNumber: '13800000000'
                      status: ACTIVE
                      departments:
                        - id: '80001'
                          code: EXAMPLE_DEPT_80001
                          name: 示例业务部
                          companyId: '80000'
                          companyName: 示例公司
        '400':
          $ref: '#/components/responses/ParamInvalid'
        '401':
          description: App-Id/App-Secret缺失、重复、错误，应用停用或入口关闭
          headers:
            WWW-Authenticate:
              schema:
                type: string
                const: AppKey realm="121-open-api"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 401
                errorCode: AUTH_INVALID
                message: App-Id或App-Secret错误、缺失，或应用已停用
                requestId: 7f7c8f45-0c8c-4b56-9b77-4c4bd7de9a41
                data: null
        '403':
          description: 用户无可用授权部门，或正文账号与请求头loginAccount不一致
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 公共loginAccount对应账号不存在或已删除，errorCode=USER_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  value:
                    code: 404
                    errorCode: USER_NOT_FOUND
                    message: 121登录账号不存在
                    requestId: 7f7c8f45-0c8c-4b56-9b77-4c4bd7de9a41
                    data: null
        '405':
          description: 请求方法不支持，code为405，errorCode为METHOD_NOT_ALLOWED
          headers:
            Allow:
              schema:
                type: string
              description: 支持的HTTP方法（POST）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: 请求体超过8KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: 不支持的媒体类型或请求体压缩
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 公共loginAccount对应账号已停用，errorCode=USER_DISABLED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/SystemError'
        '503':
          $ref: '#/components/responses/SystemBusy'
components:
  securitySchemes:
    AppId:
      type: apiKey
      in: header
      name: App-Id
      description: 121交付的应用编号，与AppSecret同时使用
    AppSecret:
      type: apiKey
      in: header
      name: App-Secret
      description: 固定密钥原样传入，仅服务端保存；与AppId同时使用
  parameters:
    AppId:
      name: App-Id
      in: header
      required: true
      description: 本环境固定值；不得重复或包含空格、换行
      schema:
        type: string
        minLength: 1
        maxLength: 256
        pattern: '^[!-~]{1,256}$'
    AppSecret:
      name: App-Secret
      in: header
      required: true
      description: 本环境固定值；不得重复或包含空格、换行
      schema:
        type: string
        minLength: 1
        maxLength: 256
        pattern: '^[!-~]{1,256}$'
    LoginAccount:
      name: loginAccount
      in: header
      required: true
      description: >-
        当前已绑定的121账号，存在且启用；非ASCII或%先UTF-8百分号编码，如张三为%E5%BC%A0%E4%B8%89。严格解码一次，+不作空格，不接受重复头、非法UTF-8或换行。解码后原始输入最多128码点，清理首尾ASCII空格后1—30码点，无内部空白、控制和格式字符。此项是操作人声明，不是独立登录凭据。
      schema:
        type: string
        minLength: 1
        maxLength: 1536
        pattern: '^[ -~]{1,1536}$'
      example: zhangsan
  schemas:
    VerifyUserRequest:
      type: object
      additionalProperties: false
      maxProperties: 1
      properties:
        loginAccount:
          type:
            - string
            - 'null'
          maxLength: 128
          deprecated: true
          description: 可选字段，建议省略。提供非null值时须与请求头loginAccount规范化后相同，否则返回403 OPERATOR_FORBIDDEN。
    Department:
      type: object
      additionalProperties: true
      required:
        - id
        - code
        - name
        - companyId
        - companyName
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
        code:
          type: string
          maxLength: 64
          description: 无部门编码时返回空字符串
        name:
          type: string
          minLength: 1
          maxLength: 100
        companyId:
          type: string
          description: 所属公司ID；未关联有效公司时为空字符串
        companyName:
          type: string
          description: 所属公司名称；未关联有效公司时为空字符串
    User:
      type: object
      additionalProperties: true
      required:
        - userId
        - loginAccount
        - userName
        - phoneNumber
        - status
        - departments
      properties:
        userId:
          type: string
          minLength: 1
          maxLength: 64
        loginAccount:
          type: string
          minLength: 1
          maxLength: 30
        userName:
          type: string
          maxLength: 100
          description: 姓名或昵称未维护时为空字符串
        phoneNumber:
          type: string
          description: 手机号；未维护时为空字符串，不影响账号校验
        status:
          type: string
          enum:
            - ACTIVE
        departments:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Department'
          description: 账号所属有效部门与应用授权部门的交集；成功响应至少包含1项
    SuccessResponse:
      type: object
      additionalProperties: true
      required:
        - code
        - errorCode
        - message
        - requestId
        - data
      properties:
        code:
          type: integer
          const: 200
          description: 数字状态码；成功为200
        errorCode:
          type: 'null'
          description: 成功时固定为null
        message:
          type: string
        requestId:
          type: string
          minLength: 16
          maxLength: 128
          description: 121自动生成的本次请求追踪编号
        data:
          $ref: '#/components/schemas/User'
    ErrorResponse:
      type: object
      additionalProperties: true
      required:
        - code
        - errorCode
        - message
        - requestId
        - data
      properties:
        code:
          type: integer
          enum:
            - 400
            - 401
            - 403
            - 404
            - 405
            - 413
            - 415
            - 422
            - 500
            - 503
          description: 数字错误码，与本次HTTP状态相同；具体原因见errorCode
        errorCode:
          type: string
          enum:
            - PARAM_INVALID
            - AUTH_INVALID
            - OPERATOR_FORBIDDEN
            - USER_NOT_FOUND
            - USER_DISABLED
            - METHOD_NOT_ALLOWED
            - PAYLOAD_TOO_LARGE
            - UNSUPPORTED_MEDIA_TYPE
            - SYSTEM_ERROR
            - SYSTEM_BUSY
        message:
          type: string
        requestId:
          type: string
          minLength: 16
          maxLength: 128
          description: 121自动生成的本次请求追踪编号
        data:
          type:
            - object
            - 'null'
          description: 无详情时为空；JSON类型或未知字段错误可返回field和reason，不回显正文
          additionalProperties: true
          properties:
            field:
              type: string
              description: 出错字段路径
            reason:
              type: string
              description: TYPE_INVALID表示类型错误；UNKNOWN_FIELD表示未定义字段
  responses:
    ParamInvalid:
      description: 公共loginAccount缺失、重复、非法编码/格式，或正文及参数不符合定义
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SystemError:
      description: 121内部异常
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SystemBusy:
      description: 121暂时不可用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
security:
  - AppId: []
    AppSecret: []
