openapi: 3.1.0
info:
  title: 121 User Verification API
  version: 2.0.0
  description: 智能化服务端使用固定App-Id、App-Secret查询有效121用户及授权部门，无需员工登录或Token。测试允许HTTP，正式HTTPS。需部署配套新Jar和配置；全部有效部门需由121显式授权。
servers:
  - url: 'http://testfcst.chinaptac.com/open-api/v1'
    description: 测试环境，允许HTTP联调；开放时间及测试凭据由121提供方交付
  - url: 'https://fcst.chinaptac.com/open-api/v1'
    description: 正式环境，使用HTTPS；开放时间及正式凭据由121提供方交付
tags:
  - name: Users
    description: 121用户查询
paths:
  /users/verify:
    post:
      tags:
        - Users
      operationId: verify121User
      summary: 查询121用户信息
      description: 按登录账号精确查询，Body JSON；不接受query或Idempotency-Key。每次请求携带App-Id、App-Secret。
      security:
        - AppId: []
          AppSecret: []
      parameters:
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/AppSecret'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyUserRequest'
            examples:
              valid:
                value:
                  loginAccount: zhangsan
      responses:
        '200':
          description: 查询成功
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: 用户查询结果不得被共享缓存保存
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              examples:
                success:
                  value:
                    code: 200
                    errorCode: null
                    message: success
                    requestId: 7f7c8f45-0c8c-4b56-9b77-4c4bd7de9a41
                    data:
                      userId: '10086'
                      loginAccount: zhangsan
                      userName: 张三
                      phoneNumber: '13800000000'
                      status: ACTIVE
                      departments:
                        - id: '80001'
                          code: EXAMPLE_DEPT_80001
                          name: 示例业务部
        '400':
          $ref: '#/components/responses/ParamInvalid'
        '401':
          description: App-Id/App-Secret缺失、重复、错误，应用停用或入口关闭
          headers:
            WWW-Authenticate:
              schema:
                type: string
                const: AppKey realm="121-open-api"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 401
                errorCode: AUTH_INVALID
                message: App-Id或App-Secret错误、缺失，或应用已停用
                requestId: 7f7c8f45-0c8c-4b56-9b77-4c4bd7de9a41
                data: null
        '403':
          description: 客户端或用户无权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 用户不存在或已删除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  value:
                    code: 404
                    errorCode: USER_NOT_FOUND
                    message: 121登录账号不存在
                    requestId: 7f7c8f45-0c8c-4b56-9b77-4c4bd7de9a41
                    data: null
        '405':
          description: 请求方法不支持，code为405，errorCode为METHOD_NOT_ALLOWED
          headers:
            Allow:
              schema:
                type: string
              description: 支持的HTTP方法（POST）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: 请求体超过8KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: 不支持的媒体类型或请求体压缩
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 用户已停用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/SystemError'
        '503':
          $ref: '#/components/responses/SystemBusy'
components:
  securitySchemes:
    AppId:
      type: apiKey
      in: header
      name: App-Id
      description: 121交付的应用编号，与AppSecret同时使用
    AppSecret:
      type: apiKey
      in: header
      name: App-Secret
      description: 固定密钥原样传入，仅服务端保存；与AppId同时使用
  parameters:
    AppId:
      name: App-Id
      in: header
      required: true
      description: 本环境固定值；不得重复或包含空格、换行
      schema:
        type: string
        minLength: 1
        maxLength: 256
        pattern: '^[!-~]{1,256}$'
    AppSecret:
      name: App-Secret
      in: header
      required: true
      description: 本环境固定值；不得重复或包含空格、换行
      schema:
        type: string
        minLength: 1
        maxLength: 256
        pattern: '^[!-~]{1,256}$'
  schemas:
    VerifyUserRequest:
      type: object
      additionalProperties: false
      required:
        - loginAccount
      maxProperties: 1
      properties:
        loginAccount:
          type: string
          minLength: 1
          maxLength: 128
          description: 原始输入最多128个Unicode码点，凭据校验后去首尾ASCII空格，结果1—30码点；禁止内部空白、控制和格式字符。按121现有语义匹配。
    Department:
      type: object
      additionalProperties: true
      required:
        - id
        - code
        - name
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
        code:
          type: string
          maxLength: 64
          description: 无部门编码时返回空字符串
        name:
          type: string
          minLength: 1
          maxLength: 100
    User:
      type: object
      additionalProperties: true
      required:
        - userId
        - loginAccount
        - userName
        - phoneNumber
        - status
        - departments
      properties:
        userId:
          type: string
          minLength: 1
          maxLength: 64
        loginAccount:
          type: string
          minLength: 1
          maxLength: 30
        userName:
          type: string
          maxLength: 100
          description: 姓名或昵称未维护时为空字符串
        phoneNumber:
          type: string
          description: 121用户资料sys_user.phonenumber中维护的完整手机号；未维护时为空字符串，不影响账号校验
        status:
          type: string
          enum:
            - ACTIVE
        departments:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Department'
          description: 当前客户端授权范围内的可操作部门
    SuccessResponse:
      type: object
      additionalProperties: true
      required:
        - code
        - errorCode
        - message
        - requestId
        - data
      properties:
        code:
          type: integer
          const: 200
          description: 数字状态码；成功为200
        errorCode:
          type: 'null'
          description: 成功时固定为null
        message:
          type: string
        requestId:
          type: string
          minLength: 16
          maxLength: 128
          description: 121自动生成的本次请求追踪编号
        data:
          $ref: '#/components/schemas/User'
    ErrorResponse:
      type: object
      additionalProperties: true
      required:
        - code
        - errorCode
        - message
        - requestId
        - data
      properties:
        code:
          type: integer
          enum:
            - 400
            - 401
            - 403
            - 404
            - 405
            - 413
            - 415
            - 422
            - 500
            - 503
          description: 数字错误码，与本次HTTP状态相同；具体原因见errorCode
        errorCode:
          type: string
          enum:
            - PARAM_INVALID
            - AUTH_INVALID
            - AUTH_FORBIDDEN
            - OPERATOR_FORBIDDEN
            - USER_NOT_FOUND
            - USER_DISABLED
            - METHOD_NOT_ALLOWED
            - PAYLOAD_TOO_LARGE
            - UNSUPPORTED_MEDIA_TYPE
            - SYSTEM_ERROR
            - SYSTEM_BUSY
        message:
          type: string
        requestId:
          type: string
          minLength: 16
          maxLength: 128
          description: 121自动生成的本次请求追踪编号
        data:
          type:
            - object
            - 'null'
          description: 无详情时为空；JSON类型或未知字段错误可返回field和reason，不回显正文
          additionalProperties: true
          properties:
            field:
              type: string
              description: 出错字段路径
            reason:
              type: string
              description: TYPE_INVALID表示类型错误；UNKNOWN_FIELD表示未定义字段
  responses:
    ParamInvalid:
      description: 参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SystemError:
      description: 121内部异常
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SystemBusy:
      description: 121暂时不可用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
security:
  - AppId: []
    AppSecret: []
